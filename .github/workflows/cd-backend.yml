name: CD – Backend Deploy

on:
  push:
    branches:
      - main
      - dev

# Cancel in-progress runs for the same branch so only the latest deploy wins
concurrency:
  group: cd-backend-${{ github.ref_name }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/sprintly-backend

jobs:
  # ─── Job 1: Build & Push ──────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up QEMU for multi-platform builds (optional, good practice)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Generate image tags: latest + short SHA
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.ref_name }}-latest
            type=sha,prefix=${{ github.ref_name }}-,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Use GitHub Actions cache to speed up subsequent builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 2: Deploy to EC2 ─────────────────────────────────────────────────
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code (for docker-compose.prod.yml)
        uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/${{ secrets.EC2_USER }}/sprintly"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # ── Write environment file from GitHub Secret ──────────────────
            mkdir -p /home/${{ secrets.EC2_USER }}/sprintly
            cd /home/${{ secrets.EC2_USER }}/sprintly

            printf '%s' '${{ secrets.BACKEND_ENV }}' > .env

            # ── Pull latest image ──────────────────────────────────────────
            IMAGE_TAG=${{ github.ref_name }}-latest
            echo "Pulling image: ${{ env.IMAGE_NAME }}:$IMAGE_TAG"
            docker pull ${{ env.IMAGE_NAME }}:$IMAGE_TAG

            # ── Update compose to use the specific branch tag ──────────────
            export BACKEND_IMAGE=${{ env.IMAGE_NAME }}:$IMAGE_TAG

            # ── Restart containers (zero-downtime via compose recreate) ────
            docker compose -f docker-compose.prod.yml up -d --pull always --remove-orphans

            # ── Prune dangling images to save disk space ───────────────────
            docker image prune -f

            echo "✅ Deployment complete on branch: ${{ github.ref_name }}"
