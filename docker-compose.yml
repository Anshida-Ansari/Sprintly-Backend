services:
  # ─── Sprintly Backend API ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: sprintly-api
    restart: unless-stopped
    ports:
      - "2000:2000"
    env_file:
      - .env
    environment:
      # Override Redis host to use the container name when running locally
      REDIS_HOST: ${REDIS_HOST:-redis}
      NODE_ENV: production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
    networks:
      - sprintly-network

networks:
  sprintly-network:
    driver: bridge
